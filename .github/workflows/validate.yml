name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha: "2026.10.4"
            harness: "pytest-homeassistant-custom-component==0.13.375"
          - ha: "2026.11.1"
            harness: "pytest-homeassistant==2026.11.1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install matching framework and test tools
        env:
          TEST_HARNESS: ${{ matrix.harness }}
        run: python -m pip install "$TEST_HARNESS" pytest-cov==7.1.0 pytest-timeout==2.4.0 ruff==0.14.5
      - run: ruff check .
      - run: ruff format --check .
      - name: Test integration
        run: python -c 'import homeassistant; import pytest; raise SystemExit(pytest.main(["-q", "--cov", "--cov-report=term-missing"]))'

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          comment: false

  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: node --test tests/frontend/*.test.mjs
      - run: python -m pip install playwright==1.65.1
      - run: python -m playwright install --with-deps chromium
      - run: npm install --prefix /tmp/dhl-a11y axe-core@4.14.0
      - name: Browser and accessibility checks
        env:
          AXE_CORE_PATH: /tmp/dhl-a11y/node_modules/axe-core/axe.min.js
        run: python tests/frontend/browser_check.py
