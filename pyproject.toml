[project]
name = "dhl-packstation"
version = "0.2.0b1"
description = "DHL Packstation compartment availability for Home Assistant"
requires-python = ">=3.14.2"

[dependency-groups]
dev = [
  "pytest-homeassistant==2026.11.1",
  "pytest-cov==7.1.0",
  "pytest-timeout==2.4.0",
  "ruff==0.14.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--strict-markers --disable-socket --allow-unix-socket --timeout=30"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.coverage.run]
source = ["custom_components.dhl_packstation"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 95
